<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Красивая Ракетка</title>
    <style>
        :root {
            --bg-color: #08090e;
            --card-bg: #11131c;
            --accent-green: #00ffcc;
            --accent-red: #ff3366;
            --text-main: #ffffff;
            --text-muted: #5e6488;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .game-wrapper {
            background: var(--card-bg);
            border: 1px solid #1f2335;
            border-radius: 28px;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            box-sizing: border-box;
        }

        /* Панель баланса */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .app-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #8f94fb, #4e54c8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-badge {
            background: #1a1d29;
            border: 1px solid #282d42;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            color: #ffcc00;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Лента истории иксов */
        .history-line {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }
        .history-line::-webkit-scrollbar { display: none; }
        .history-badge {
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: bold;
            background: #171924;
            color: #a0a5c1;
            border: 1px solid #232738;
            min-width: 45px;
            text-align: center;
        }
        .badge-high { color: var(--accent-green); border-color: rgba(0, 255, 204, 0.3); }
        .badge-low { color: var(--accent-red); border-color: rgba(255, 51, 102, 0.3); }

        /* Космическая арена */
        .arena-container {
            background: #05060a;
            border-radius: 20px;
            height: 280px;
            position: relative;
            overflow: hidden;
            border: 1px solid #161824;
            margin-bottom: 20px;
        }
        #space-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .overlay-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        #multiplier {
            font-size: 64px;
            font-weight: 900;
            color: var(--accent-green);
            text-shadow: 0 0 30px rgba(0, 255, 204, 0.3);
            transition: transform 0.05s linear;
        }
        #status-text {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-muted);
            margin-top: 5px;
        }
        .crashed-style {
            color: var(--accent-red) !important;
            text-shadow: 0 0 30px rgba(255, 51, 102, 0.4) !important;
        }

        /* Управление ставками */
        .bet-controls {
            background: #161824;
            padding: 15px;
            border-radius: 18px;
            border: 1px solid #232738;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0c0d14;
            padding: 8px 15px;
            border-radius: 12px;
            border: 1px solid #1f2233;
        }
        .input-row label {
            font-size: 13px;
            color: #8389ad;
            font-weight: 500;
        }
        input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-align: right;
            width: 50%;
            outline: none;
        }
        
        #action-btn {
            background: linear-gradient(135deg, #00ffcc 0%, #00bfff 100%);
            border: none;
            color: #05060a;
            padding: 18px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 5px 20px rgba(0, 255, 204, 0.2);
            transition: all 0.2s ease;
        }
        #action-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="top-bar">
        <div class="app-title">FROG ROCKET</div>
        <div class="balance-badge">⭐ <span id="balance-amount">5000</span></div>
    </div>

    <div class="history-line" id="history-line">
        <div class="history-badge badge-high">x2.34</div>
        <div class="history-badge badge-low">x1.12</div>
        <div class="history-badge badge-high">x14.5</div>
        <div class="history-badge badge-low">x1.04</div>
        <div class="history-badge badge-high">x3.21</div>
    </div>

    <div class="arena-container" id="arena">
        <canvas id="space-canvas"></canvas>
        <div class="overlay-ui">
            <div id="multiplier">1.00x</div>
            <div id="status-text">Ожидание ставки</div>
        </div>
    </div>

    <div class="bet-controls">
        <div class="input-row">
            <label>Ваша ставка</label>
            <input type="number" id="bet-input" value="100" min="10">
        </div>
        <button id="action-btn" onclick="handleButtonClick()">Поставить</button>
    </div>
</div>

<!-- СЮДА ВСТАВИМ ШАГ 2 -->

<script>
    let balance = 5000;
    let isPlaying = false;
    let currentX = 1.00;
    let crashPoint = 1.00;
    let gameInterval = null;

    const balanceDisplay = document.getElementById("balance-amount");
    const multDisplay = document.getElementById("multiplier");
    const statusDisplay = document.getElementById("status-text");
    const actionBtn = document.getElementById("action-btn");
    const betInput = document.getElementById("bet-input");
    const historyLine = document.getElementById("history-line");

    const canvas = document.getElementById("space-canvas");
    const ctx = canvas.getContext("2d");

    function initCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    initCanvas();

    // Параметры красивой графики
    let rocket = { x: 50, y: 220, size: 45 };
    let stars = [];
    let trail = [];
    let blastParticles = [];
    let isCrashed = false;

    // Инициализация звездного неба
    for(let i = 0; i < 40; i++) {
        stars.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 1.8 + 0.5,
            speed: Math.random() * 1.2 + 0.4
        });
    }

    // Главный цикл рендеринга (60 FPS)
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Рисуем сетку координат на фоне
        ctx.strokeStyle = "rgba(35, 39, 56, 0.2)";
        ctx.lineWidth = 1;
        let gridSize = 30;
        for (let x = 0; x < canvas.width; x += gridSize) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += gridSize) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }

        // 2. Движение звезд (эффект глубины космоса)
        ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
        stars.forEach(s => {
            if (isPlaying && !isCrashed) {
                s.x -= s.speed * 2.5;
                s.y += s.speed * 1.5;
                if(s.x < 0) s.x = canvas.width;
                if(s.y > canvas.height) s.y = 0;
            }
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
        });

        // 3. Рисуем неоновую линию графика-траектории полета
        if (isPlaying || isCrashed) {
            ctx.strokeStyle = "rgba(0, 255, 204, 0.6)";
            ctx.lineWidth = 4;
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00ffcc";
            ctx.beginPath();
            ctx.moveTo(50, canvas.height - 40);
            
            ctx.quadraticCurveTo(
                50 + (rocket.x - 50) / 2, canvas.height - 40,
                rocket.x, rocket.y
            );
            ctx.stroke();
            ctx.shadowBlur = 0; 
        }

        // 4. Генерация и отрисовка пламени (шлейфа)
        if (isPlaying && !isCrashed) {
            trail.push({
                x: rocket.x - 25,
                y: rocket.y + 15,
                size: Math.random() * 6 + 3,
                alpha: 1,
                color: Math.random() > 0.4 ? '#ff3366' : '#ff9900'
            });
        }

        trail.forEach((p, idx) => {
            p.x -= 3; p.y += 1.5; p.alpha -= 0.04;
            if (p.alpha <= 0) { trail.splice(idx, 1); return; }
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // 5. Отрисовка взрыва в случае Краша
        if (isCrashed) {
            blastParticles.forEach((bp, idx) => {
                bp.x += bp.vx; bp.y += bp.vy; bp.alpha -= 0.02;
                if (bp.alpha <= 0) { blastParticles.splice(idx, 1); return; }
                ctx.fillStyle = bp.color;
                ctx.globalAlpha = bp.alpha;
                ctx.beginPath(); ctx.arc(bp.x, bp.y, bp.size, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1.0;
        }

        // 6. Отрисовка самой Ракеты
        if (isPlaying && !isCrashed) {
            ctx.save();
            ctx.translate(rocket.x, rocket.y);
            ctx.rotate(-Math.PI / 8 - (currentX * 0.01));
            ctx.font = `${rocket.size}px Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("🚀", 0, 0);
            ctx.restore();
        }

        requestAnimationFrame(render);
    }
    render();

    function handleButtonClick() {
        if (!isPlaying) {
            const betValue = parseInt(betInput.value);
            if (isNaN(betValue) || betValue <= 0 || betValue > balance) {
                alert("Некорректная ставка или баланс!"); return;
            }

            balance -= betValue;
            balanceDisplay.innerText = balance;

            isPlaying = true;
            isCrashed = false;
            trail = [];
            blastParticles = [];
            betInput.disabled = true;
            
            actionBtn.innerText = "ЗАБРАТЬ Х";
            actionBtn.style.background = "linear-gradient(135deg, #ffcc00 0%, #ff6600 100%)";
            actionBtn.style.boxShadow = "0 5px 20px rgba(255, 153, 0, 0.3)";
            multDisplay.classList.remove("crashed-style");
            statusDisplay.innerText = "Взлёт...";

            rocket.x = 50;
            rocket.y = canvas.height - 50;

            currentX = 1.00;
            let rand = Math.random();
            crashPoint = rand < 0.05 ? 1.00 : parseFloat((Math.random() * (7.00 - 1.10) + 1.10).toFixed(2));

            gameInterval = setInterval(() => {
                currentX += 0.02;

                rocket.x = 50 + (currentX - 1) * 40;
                rocket.y = (canvas.height - 50) - Math.pow(currentX - 1, 1.25) * 25;

                if (rocket.x > canvas.width - 50) rocket.x = canvas.width - 50;
                if (rocket.y < 50) rocket.y = 50;

                if (currentX >= crashPoint) {
                    triggerCrash();
                } else {
                    multDisplay.innerText = currentX.toFixed(2) + "x";
                    multDisplay.style.transform = `scale(${1 + (currentX * 0.005)})`;
                }
            }, 50);

        } else {
            collectWin();
        }
    }

    function collectWin() {
        clearInterval(gameInterval);
        isPlaying = false;
        
        const betValue = parseInt(betInput.value);
        const winAmount = Math.floor(betValue * currentX);
        balance += winAmount;
        balanceDisplay.innerText = balance;

        statusDisplay.innerText = "Успешный кэшаут!";
        multDisplay.innerText = "Выиграно: " + winAmount + " ⭐";
        
        addHistoryBadge(currentX.toFixed(2), true);
        resetUI();
    }

    function triggerCrash() {
        clearInterval(gameInterval);
        isPlaying = false;
        isCrashed = true;

        for(let i=0; i<25; i++) {
            blastParticles.push({
                x: rocket.x, y: rocket.y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                size: Math.random() * 6 + 2,
                alpha: 1,
                color: Math.random() > 0.5 ? '#ff3366' : '#ffcc00'
            });
        }

        multDisplay.innerText = "КРАШ " + crashPoint.toFixed(2) + "x";
        multDisplay.classList.add("crashed-style");
        multDisplay.style.transform = "scale(1)";
        statusDisplay.innerText = "Ракета взорвалась";

        addHistoryBadge(crashPoint.toFixed(2), false);
        resetUI();
    }

    function addHistoryBadge(val, isWin) {
        const badge = document.createElement("div");
        badge.className = `history-badge ${isWin ? 'badge-high' : 'badge-low'}`;
        badge.innerText = "x" + val;
        historyLine.insertBefore(badge, historyLine.firstChild);
    }

    function resetUI() {
        betInput.disabled = false;
        actionBtn.innerText = "Поставить";
        actionBtn.style.background = "linear-gradient(135deg, #00ffcc 0%, #00bfff 100%)";
        actionBtn.style.boxShadow = "0 5px 20px rgba(0, 255, 204, 0.2)";
    }
</script>
</body>
</html>
